name: Feature request
description: Suggest an API, adapter or plugin
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      render: ts
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
